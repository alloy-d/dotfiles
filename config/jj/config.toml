[user]
name = "Adam Lloyd"
email = "adam@alloy-d.net"

[git]
sign-on-push = true

[signing]
# This configuration option has changed in trunk, and leaving it
# unspecified seems Fine™ anyway.
#
# sign-all = false
# behavior = "drop"


# It seems like git.sign-on-push isn't working as expected with the GPG
# backend right now, but the SSH backend is working fine.
#
# This is fine; my SSH key is just my GPG key, anyway.

# backend = "gpg"
# key = "CE6763347250996E"
backend = "ssh"
key = "ssh-rsa "

[template-aliases]
'commit_timestamp(commit)' = 'commit.author().timestamp()'

[ui]
diff-editor = ":builtin"
show-cryptographic-signatures = true
